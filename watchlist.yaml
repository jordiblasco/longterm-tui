# Optional. Everything below is optional; shown with its defaults.
settings:
  period: 2y            # price history used for RSI / MACD / SMAs (SMA200 needs > 1y)
  thresholds:
    rsi_buy: 30         # RSI below  -> buy signal
    rsi_sell: 70        # RSI above  -> sell signal
    peg_buy: 1.0
    peg_sell: 2.0
    roe_buy: 15         # percent
    roe_sell: 8         # percent
    current_ratio_buy: 1.5
    current_ratio_sell: 1.0
    score_buy: 2        # total score >= 2  -> BUY   (<= -2 -> SELL)
    score_strong: 4     # total score >= 4  -> STRONG BUY (<= -4 -> STRONG SELL)
    # "Buy the dip" (all conditions must hold; upgrades HOLD/BUY to BUY THE DIP)
    dip_min_drawdown_pct: 10        # at least 10% below the 52-week high ...
    dip_max_drawdown_pct: 35        # ... but not more than 35% (avoid falling knives)
    dip_rsi_max: 40                 # RSI cooled off to 40 or lower
    dip_sma200_tolerance_pct: 10    # price not more than 10% under the SMA200
    dip_require_rising_sma200: true # long-term trend (SMA200) still pointing up
    dip_min_fundamentals: 2         # need PEG/ROE/current-ratio data for >= 2 metrics
